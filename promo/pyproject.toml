[project]
name = "pinky-promo"
version = "0.1.0"
description = "Renders the pinky promo video: soundtrack bounced from the DAW's own engine (node promo/bounce.mjs), motion graphics drawn frame by frame, muxed with ffmpeg."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pillow>=10.4",
    "imageio-ffmpeg>=0.5",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
